[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-share-kit"
version = "0.1.3"
description = "Local-first shared memory for desktop agents"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0"]

[project.scripts]
memory-share = "memory_share.cli:main"

[tool.setuptools.packages.find]
include = ["memory_share*"]
